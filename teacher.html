<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王老师中文课堂 - 教师控制台</title>
    <!-- 引入高安全级别的 MQTT 和 二维码生成库 -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; gap: 20px; }
        .sidebar { width: 280px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .main-panel { flex: 1; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1, h2, h3 { color: #333; }
        .btn { background: #6f42c1; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; margin: 5px; font-weight: bold; }
        .btn:hover { background: #5936a2; }
        .status-box { padding: 10px; background: #e0f2fe; color: #0284c7; border-radius: 6px; margin-bottom: 20px; font-weight: bold; }
        .qrcode-container { margin-top: 20px; padding: 15px; background: #faf5ff; border: 1px solid #e9d5ff; border-radius: 8px; text-align: center; }
        
        /* 网格卡片区 */
        .grid-area { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { padding: 15px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold;}
        
        /* 词语搭配容器 */
        .match-container { display: flex; justify-content: space-between; gap: 20px; }
        .match-col { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        
        /* 玩家列表与卧底游戏 */
        .student-item { display: inline-block; padding: 8px 12px; background: #e2e8f0; border-radius: 20px; margin: 5px; cursor: pointer;}
        .student-item.selected { background: #10b981; color: white; }
        .cloud-word { display: inline-block; font-size: 24px; padding: 10px; color: #6f42c1; font-weight: bold; animation: popIn 0.5s ease; }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>王老师中文课堂</h2>
    <div class="status-box" id="sys-status">🟡 正在连接服务器...</div>
    <div class="status-box" style="background:#dcfce7; color:#166534;">当前在线人数: <span id="online-count">0</span></div>
    
    <div class="qrcode-container">
        <h3>扫码加入课堂</h3>
        <div id="qrcode" style="display:flex; justify-content:center;"></div>
        <p style="font-size:12px; color:#666;">或输入网址: <br><span id="student-url"></span></p>
    </div>

    <hr style="margin:20px 0; border:0; border-top:1px solid #ccc;">
    <h3>在线学生列表</h3>
    <div id="student-list"></div>
</div>

<div class="main-panel">
    <!-- 顶部导航 -->
    <div>
        <button class="btn" onclick="showPanel('panel-match')">词语搭配</button>
        <button class="btn" onclick="showPanel('panel-quiz')">单项选择</button>
        <button class="btn" onclick="showPanel('panel-shadow')">HSKK 跟读</button>
        <button class="btn" onclick="showPanel('panel-guess')">我说你猜</button>
        <button class="btn" onclick="showPanel('panel-undercover')">谁是卧底</button>
        <button class="btn" onclick="showPanel('panel-cloud')">动态词云</button>
    </div>

    <!-- 1. 词语搭配 -->
    <div id="panel-match" style="display:block;">
        <h2>词语搭配 (连线)</h2>
        <button class="btn" onclick="sendMatchGame()">一键发送给学生</button>
        <div class="match-container" id="match-display" style="margin-top:20px;"></div>
    </div>

    <!-- 2. 单项选择 -->
    <div id="panel-quiz" style="display:none;">
        <h2>单项选择 (词汇/语法)</h2>
        <div class="grid-area" id="quiz-display"></div>
    </div>

    <!-- 3. HSKK 跟读 -->
    <div id="panel-shadow" style="display:none;">
        <h2>HSKK 长难句跟读</h2>
        <div id="shadow-display"></div>
    </div>

    <!-- 4. 我说你猜 (已修复不重复逻辑) -->
    <div id="panel-guess" style="display:none;">
        <h2>我说你猜</h2>
        <button class="btn" onclick="nextGuessWord()" style="padding:15px 30px; font-size:20px;">🎲 抽取下一个词</button>
        <button class="btn" onclick="resetGuess()" style="background:#64748b;">重置词库</button>
        <h1 id="guess-word-display" style="font-size: 80px; text-align: center; color: #d946ef; margin-top: 50px;">等待抽取</h1>
        <p style="text-align:center; color:#666;" id="guess-remain">剩余词数：10</p>
    </div>

    <!-- 5. 谁是卧底 (已修复选人逻辑) -->
    <div id="panel-undercover" style="display:none;">
        <h2>谁是卧底</h2>
        <p>请点击左侧列表中的学生，选中 <b>4</b> 名玩家进入游戏：</p>
        <div style="padding:20px; background:#f1f5f9; border-radius:8px;">
            <h3>当前确认就位的玩家 (<span id="uc-count">0</span>/4)：</h3>
            <div id="uc-players" style="min-height: 40px; font-size: 20px; font-weight:bold; color:#10b981;">等待选人...</div>
        </div>
        <button class="btn" onclick="startUndercover()" style="margin-top:20px; background:#f59e0b; padding:15px 30px; font-size:18px;">🎭 一键分发角色牌</button>
        <p id="uc-result" style="margin-top:10px; font-weight:bold;"></p>
    </div>

    <!-- 6. 动态词云 -->
    <div id="panel-cloud" style="display:none;">
        <h2>动态词云 (学生发送词语上大屏)</h2>
        <button class="btn" onclick="sendCloudTask()">开启词云通道</button>
        <button class="btn" onclick="document.getElementById('cloud-canvas').innerHTML=''" style="background:#64748b;">清空公屏</button>
        <div id="cloud-canvas" style="margin-top:20px; min-height:400px; background:#f8fafc; border:2px dashed #cbd5e1; border-radius:10px; padding:20px; display:flex; flex-wrap:wrap; align-content:flex-start;"></div>
    </div>
</div>

<script src="data_hsk4_11.js"></script>
<script>
    // --- 核心：安全无延迟的 MQTT 通讯 ---
    const ROOM_ID = "WangTeacher_HSK_Room1";
    // 强制使用 WSS (加密 WebSocket)，完美解决 GitHub Pages 的拦截问题
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt'); 
    
    let onlineStudents = new Set();
    let selectedUndercoverPlayers = [];

    // --- 生成专属学生端二维码 ---
    // 自动获取当前域名的 student.html
    const studentUrl = window.location.href.replace('teacher.html', 'student.html');
    document.getElementById('student-url').innerText = studentUrl;
    new QRCode(document.getElementById("qrcode"), {
        text: studentUrl,
        width: 150,
        height: 150
    });

    client.on('connect', () => {
        document.getElementById('sys-status').innerHTML = "🟢 系统连接成功！准备上课";
        client.subscribe(`${ROOM_ID}/student_join`);
        client.subscribe(`${ROOM_ID}/cloud_word`);
    });

    client.on('message', (topic, message) => {
        const msg = JSON.parse(message.toString());
        
        if (topic === `${ROOM_ID}/student_join`) {
            onlineStudents.add(msg.name);
            updateStudentList();
        } else if (topic === `${ROOM_ID}/cloud_word`) {
            // 收到学生的词云弹幕
            const cloudCanvas = document.getElementById('cloud-canvas');
            const span = document.createElement('span');
            span.className = 'cloud-word';
            span.innerText = `${msg.word} (${msg.name})`;
            // 随机大小和颜色
            span.style.fontSize = Math.floor(Math.random() * 20 + 20) + 'px';
            span.style.color = ['#dc2626','#ea580c','#16a34a','#2563eb','#7c3aed'][Math.floor(Math.random()*5)];
            cloudCanvas.appendChild(span);
        }
    });

    // --- 面板切换 ---
    function showPanel(id) {
        const panels = ['panel-match', 'panel-quiz', 'panel-shadow', 'panel-guess', 'panel-undercover', 'panel-cloud'];
        panels.forEach(p => document.getElementById(p).style.display = (p === id ? 'block' : 'none'));
        renderData(id);
    }

    // --- 渲染数据与修复逻辑 ---
    function renderData(id) {
        if (id === 'panel-match') {
            const leftCol = window.lessonData.match_pairs.map(p => p.left).sort(() => Math.random() - 0.5);
            const rightCol = window.lessonData.match_pairs.map(p => p.right).sort(() => Math.random() - 0.5);
            let h = `<div class="match-col">`;
            leftCol.forEach(w => h += `<div class="card">${w}</div>`);
            h += `</div><div class="match-col">`;
            rightCol.forEach(w => h += `<div class="card">${w}</div>`);
            h += `</div>`;
            document.getElementById('match-display').innerHTML = h;
        } else if (id === 'panel-quiz') {
            let h = '';
            window.lessonData.vocab_questions.forEach((q, i) => {
                h += `<div class="card" style="text-align:left; font-size:16px;">
                        <div>Q${i+1}: ${q.q}</div>
                        <button class="btn" style="margin-top:10px; width:100%;" onclick="sendQuiz(${i})">发送此题</button>
                      </div>`;
            });
            document.getElementById('quiz-display').innerHTML = h;
        } else if (id === 'panel-shadow') {
            let h = '';
            window.lessonData.shadowing_sentences.forEach((s, i) => {
                h += `<div class="card" style="margin-bottom:10px; text-align:left;">【句子 ${i+1}】 ${s}</div>`;
            });
            document.getElementById('shadow-display').innerHTML = h;
        }
    }

    // --- 修复：不重复的“我说你猜” ---
    let guessPool = [...window.lessonData.guess_words];
    function nextGuessWord() {
        if (guessPool.length === 0) {
            document.getElementById('guess-word-display').innerText = "🎉 词库已抽完！";
            return;
        }
        // 随机抽取并从数组中删除
        const randomIndex = Math.floor(Math.random() * guessPool.length);
        const word = guessPool.splice(randomIndex, 1)[0];
        
        document.getElementById('guess-word-display').innerText = word;
        document.getElementById('guess-remain').innerText = `剩余词数：${guessPool.length}`;
    }
    function resetGuess() {
        guessPool = [...window.lessonData.guess_words];
        document.getElementById('guess-word-display').innerText = "等待抽取";
        document.getElementById('guess-remain').innerText = `剩余词数：${guessPool.length}`;
    }

    // --- 修复：谁是卧底 (指定4人) ---
    function updateStudentList() {
        const listDiv = document.getElementById('student-list');
        listDiv.innerHTML = '';
        document.getElementById('online-count').innerText = onlineStudents.size;
        
        onlineStudents.forEach(name => {
            const span = document.createElement('span');
            span.className = 'student-item';
            if(selectedUndercoverPlayers.includes(name)) span.classList.add('selected');
            span.innerText = name;
            span.onclick = () => togglePlayer(name);
            listDiv.appendChild(span);
        });
    }

    function togglePlayer(name) {
        if (selectedUndercoverPlayers.includes(name)) {
            selectedUndercoverPlayers = selectedUndercoverPlayers.filter(n => n !== name);
        } else {
            if (selectedUndercoverPlayers.length >= 4) {
                alert("最多只能选 4 个人哦！");
                return;
            }
            selectedUndercoverPlayers.push(name);
        }
        updateStudentList();
        document.getElementById('uc-count').innerText = selectedUndercoverPlayers.length;
        document.getElementById('uc-players').innerText = selectedUndercoverPlayers.length > 0 ? selectedUndercoverPlayers.join("，") : "等待选人...";
    }

    function startUndercover() {
        if (selectedUndercoverPlayers.length !== 4) {
            alert("请必须在左侧列表选中 4 名在线学生！");
            return;
        }
        // 抽取词组
        const wordSet = window.lessonData.undercover_words[Math.floor(Math.random() * window.lessonData.undercover_words.length)];
        
        // 打乱这4个人
        let players = [...selectedUndercoverPlayers].sort(() => Math.random() - 0.5);
        let undercover = players[0]; // 第一个当卧底
        let civilians = players.slice(1); // 剩下三个平民

        // 挨个单独发身份牌！
        client.publish(`${ROOM_ID}/undercover`, JSON.stringify({ target: undercover, role: "卧底", word: wordSet.undercover }));
        civilians.forEach(p => {
            client.publish(`${ROOM_ID}/undercover`, JSON.stringify({ target: p, role: "平民", word: wordSet.civilian }));
        });

        document.getElementById('uc-result').innerHTML = `
            <span style="color:#10b981">卡牌已发送到这4位同学的手机！</span><br>
            (教师天眼：卧底是 <b>${undercover}</b> [${wordSet.undercover}]，平民是 <b>${civilians.join(",")}</b> [${wordSet.civilian}])
        `;
    }

    // --- 发送其他互动指令 ---
    function sendMatchGame() {
        client.publish(`${ROOM_ID}/action`, JSON.stringify({ type: "match", data: window.lessonData.match_pairs }));
        alert("连线题已发送至所有学生手机！");
    }

    function sendQuiz(index) {
        client.publish(`${ROOM_ID}/action`, JSON.stringify({ type: "quiz", data: window.lessonData.vocab_questions[index] }));
        alert("单选题已发送！");
    }

    function sendCloudTask() {
        client.publish(`${ROOM_ID}/action`, JSON.stringify({ type: "cloud", title: "请发送一个形容压力的词：" }));
        alert("词云通道已开启，学生端已弹出输入框！");
    }

    // 初始化渲染
    window.onload = () => showPanel('panel-match');
</script>
</body>
</html>
