<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>学生端 - 课堂互动</title>
    <!-- 使用相同的加密 MQTT 库 -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #6f42c1; color: white; text-align: center; padding: 20px; margin: 0; }
        .login-box { margin-top: 50px; background: white; color: #333; padding: 30px; border-radius: 12px; }
        input { width: 80%; padding: 15px; font-size: 18px; border: 2px solid #ccc; border-radius: 8px; margin-bottom: 20px;}
        button { background: #10b981; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold;}
        .work-area { display: none; margin-top: 20px; background: white; color: #333; padding: 20px; border-radius: 12px; min-height: 400px;}
        
        /* 卧底卡牌样式 */
        .card-secret { background: #fef08a; border: 2px dashed #eab308; padding: 30px; border-radius: 10px; margin-top: 20px;}
        .card-secret h1 { color: #b45309; font-size: 40px; margin: 10px 0;}
    </style>
</head>
<body>

<div id="login-box" class="login-box">
    <h2>欢迎来到中文课堂</h2>
    <p>请输入你的真实姓名：</p>
    <input type="text" id="studentName" placeholder="例如：安妮 / Anna">
    <button onclick="joinClass()">加入课堂</button>
</div>

<div id="work-area" class="work-area">
    <h2 id="task-title" style="color:#6f42c1;">等待老师发题...</h2>
    <div id="task-content">
        <p style="color:#666;">请看大屏幕听讲，当老师发题时，这里会自动亮起。</p>
    </div>
</div>

<script>
    const ROOM_ID = "WangTeacher_HSK_Room1";
    // 强制使用 WSS 保证在 GitHub Pages 的 HTTPS 环境下能连上！
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt'); 
    let myName = "";

    function joinClass() {
        myName = document.getElementById('studentName').value.trim();
        if (!myName) { alert("名字不能为空哦！"); return; }
        
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('work-area').style.display = 'block';

        // 告诉大屏：我进来了！
        client.publish(`${ROOM_ID}/student_join`, JSON.stringify({ name: myName }));
        
        // 监听指令
        client.subscribe(`${ROOM_ID}/action`);
        // 监听属于自己的卧底卡牌
        client.subscribe(`${ROOM_ID}/undercover`);
    }

    client.on('message', (topic, message) => {
        const msg = JSON.parse(message.toString());

        // 1. 处理点对点的【谁是卧底】卡牌
        if (topic === `${ROOM_ID}/undercover`) {
            // 只有发给我的，我才看得到！
            if (msg.target === myName) {
                document.getElementById('task-title').innerText = "🤫 你的专属身份牌";
                document.getElementById('task-content').innerHTML = `
                    <div class="card-secret">
                        <p>你的词语是：</p>
                        <h1>${msg.word}</h1>
                        <p style="color:#666; font-size:14px;">不要给别人看哦！轮到你时，请描述这个词。</p>
                    </div>
                `;
            }
        } 
        // 2. 处理大屏幕的统一广播指令
        else if (topic === `${ROOM_ID}/action`) {
            if (msg.type === "match") {
                document.getElementById('task-title').innerText = "📝 词语搭配 (请看大屏作答)";
                document.getElementById('task-content').innerHTML = `<p>大屏幕上出现了连线题，请大声告诉老师答案！</p>`;
            } 
            else if (msg.type === "quiz") {
                document.getElementById('task-title').innerText = "❓ 单项选择题";
                let h = `<p style="font-size:18px; font-weight:bold;">${msg.data.q}</p><div style="display:flex; flex-direction:column; gap:10px;">`;
                msg.data.options.forEach(opt => {
                    h += `<button style="background:#e0f2fe; color:#0284c7;">${opt}</button>`;
                });
                h += `</div>`;
                document.getElementById('task-content').innerHTML = h;
            }
            else if (msg.type === "cloud") {
                document.getElementById('task-title').innerText = "☁️ 词云互动";
                document.getElementById('task-content').innerHTML = `
                    <p style="font-weight:bold;">${msg.title}</p>
                    <input type="text" id="cloudInput" placeholder="输入词语...">
                    <button onclick="submitCloud()">发射弹幕！</button>
                `;
            }
        }
    });

    // 提交词云
    function submitCloud() {
        const word = document.getElementById('cloudInput').value.trim();
        if (!word) return;
        client.publish(`${ROOM_ID}/cloud_word`, JSON.stringify({ name: myName, word: word }));
        document.getElementById('cloudInput').value = ""; // 清空输入框
        alert("弹幕已发射到大屏幕！");
    }
</script>
</body>
</html>
