<!DOCTYPE html>
<html lang="zh-CN">     
<head>  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王老师中文课堂 - HSK 智能教学与测试平台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  .level-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  .level-card:hover { transform: translateY(-4px); }
  .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
  .accordion-content.active { max-height: 1000px; transition: max-height 0.5s ease-in; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-book-open-reader text-2xl text-amber-300"></i>
        <div>
          <h1 class="text-xl font-bold tracking-wide">王老师中文课堂</h1>
          <p class="text-xs text-indigo-200">Wang Teacher's Chinese Learning Suite</p>
        </div>
      </div>
      <div class="flex items-center space-x-3 text-sm">
        <span class="bg-indigo-800 px-3 py-1 rounded-full text-indigo-100 flex items-center border border-indigo-600">
          <i class="fa-solid fa-circle text-emerald-400 text-xs mr-2 animate-pulse"></i> 系统状态：全功能就绪
        </span>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
    <div class="bg-gradient-to-r from-indigo-600 to-blue-500 rounded-2xl p-6 text-white shadow-xl mb-8 flex justify-between items-center">
      <div>
        <h2 class="text-2xl font-bold mb-2">欢迎来到 HSK 互动教学大厅</h2>
        <p class="text-indigo-100 max-w-2xl">系统已基于《HSK标准教程》(融合HSK 3.0新国标) 精细化设计，支持学、练、测、赛、趣、评六大维度在线同步教学。</p>
      </div>
      <div class="hidden md:block">
        <i class="fa-solid fa-graduation-cap text-6xl text-indigo-200 opacity-80"></i>
      </div>
    </div>

    <h3 class="text-lg font-bold text-slate-700 mb-4 flex items-center">
      <i class="fa-solid fa-layer-group text-indigo-600 mr-2"></i> HSK 课程体系选择
    </h3>

    <div class="space-y-4" id="hsk-accordion">
      <!-- HSK 1-3 -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden level-card">
        <button class="w-full px-6 py-4 flex justify-between items-center bg-white hover:bg-slate-50 transition-colors">
          <div class="flex items-center space-x-4">
            <span class="w-10 h-10 rounded-lg bg-emerald-100 text-emerald-600 font-bold flex items-center justify-center text-lg">H1</span>
            <div class="text-left"><h4 class="font-bold text-slate-800">HSK 1 级 (入门级)</h4><p class="text-xs text-slate-500">掌握 300 词汇 · 基础日常沟通</p></div>
          </div>
        </button>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden level-card">
        <button class="w-full px-6 py-4 flex justify-between items-center bg-white hover:bg-slate-50 transition-colors">
          <div class="flex items-center space-x-4">
            <span class="w-10 h-10 rounded-lg bg-teal-100 text-teal-600 font-bold flex items-center justify-center text-lg">H2</span>
            <div class="text-left"><h4 class="font-bold text-slate-800">HSK 2 级 (初级)</h4><p class="text-xs text-slate-500">掌握 500 词汇 · 简单生活交流</p></div>
          </div>
        </button>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden level-card">
        <button class="w-full px-6 py-4 flex justify-between items-center bg-white hover:bg-slate-50 transition-colors">
          <div class="flex items-center space-x-4">
            <span class="w-10 h-10 rounded-lg bg-sky-100 text-sky-600 font-bold flex items-center justify-center text-lg">H3</span>
            <div class="text-left"><h4 class="font-bold text-slate-800">HSK 3 级 (进阶级)</h4><p class="text-xs text-slate-500">掌握 1000 词汇 · 完成工作生活表达</p></div>
          </div>
        </button>
      </div>

      <!-- HSK 4 (当前精讲课程) -->
      <div class="bg-white rounded-xl shadow border-2 border-indigo-200 overflow-hidden level-card">
        <button onclick="toggleAccordion('hsk4')" class="w-full px-6 py-4 flex justify-between items-center bg-indigo-50/50 hover:bg-indigo-50 transition-colors">
          <div class="flex items-center space-x-4">
            <span class="w-10 h-10 rounded-lg bg-indigo-600 text-white font-bold flex items-center justify-center text-lg shadow">H4</span>
            <div class="text-left">
              <div class="flex items-center space-x-2">
                <h4 class="font-bold text-indigo-950">HSK 4 级 (中级)</h4>
                <span class="bg-indigo-600 text-white text-[10px] px-2 py-0.5 rounded-full font-medium">重点精讲</span>
              </div>
              <p class="text-xs text-indigo-600">掌握 2000 词汇 · 讨论较复杂的话题</p>
            </div>
          </div>
          <i id="icon-hsk4" class="fa-solid fa-chevron-down text-indigo-600 transition-transform"></i>
        </button>
        
        <div id="hsk4" class="accordion-content bg-slate-50 border-t border-indigo-100 px-6 py-4 space-y-3">
          <!-- 第 11 课 (一课时完整版) -->
          <div class="bg-white p-5 rounded-xl border border-indigo-100 shadow-sm hover:shadow-md transition-all">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <h5 class="font-bold text-slate-800 text-lg">第 11 课：《读书好，读好书，好读书》</h5>
                <p class="text-sm text-slate-500 mt-1">包含：核心生词、语法精讲、双语/三语匹配、全真测试与诸神之战。</p>
              </div>
              <div class="flex space-x-3 w-full md:w-auto mt-2 md:mt-0">
                <a href="teacher.html" class="flex-1 md:flex-none flex items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg font-bold transition shadow-sm">
                  <i class="fa-solid fa-chalkboard-user mr-2"></i> 开始上课 (教师端)
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- HSK 5 -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden level-card">
        <button class="w-full px-6 py-4 flex justify-between items-center bg-white hover:bg-slate-50 transition-colors">
          <div class="flex items-center space-x-4">
            <span class="w-10 h-10 rounded-lg bg-purple-100 text-purple-600 font-bold flex items-center justify-center text-lg">H5</span>
            <div class="text-left"><h4 class="font-bold text-slate-800">HSK 5 级 (高级)</h4><p class="text-xs text-slate-500">掌握 3600 词汇 · 阅读中文报刊电影</p></div>
          </div>
        </button>
      </div>
    </div>
  </main>

  <script>
    function toggleAccordion(id) {
      const el = document.getElementById(id);
      const icon = document.getElementById('icon-' + id);
      const isActive = el.classList.contains('active');
      document.querySelectorAll('.accordion-content').forEach(item => item.classList.remove('active'));
      document.querySelectorAll('[id^="icon-"]').forEach(item => item.classList.remove('rotate-180'));
      if (!isActive) { el.classList.add('active'); icon.classList.add('rotate-180'); }
    }
    window.addEventListener('DOMContentLoaded', () => toggleAccordion('hsk4'));
  </script>
</body>
</html>
