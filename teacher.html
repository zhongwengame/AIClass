<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSK 全阶段教学与测试平台 - 教师端控制台</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div id="app" class="max-w-4xl mx-auto p-6">
    <header class="mb-8 flex justify-between items-center bg-white p-6 rounded-xl shadow-md border border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">HSK 互动课堂 - 教师中控台</h1>
        <p class="text-slate-500 text-sm mt-1">控制课堂进度、推送练习与实时互动</p>
      </div>
      <div class="px-3 py-1 bg-emerald-100 text-emerald-700 text-xs font-semibold rounded-full">
        系统状态：在线
      </div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- 课程选择与控制 -->
      <section class="md:col-span-2 bg-white p-6 rounded-xl shadow-md border border-slate-200">
        <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">1. 选择教学/练习内容</h2>
        
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">选择课程级别 JSON：</label>
            <select v-model="selectedJson" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="data/hsk4-l11.json">HSK 4 - 第11课：读书好，读好书，好读书</option>
            </select>
          </div>

          <div v-if="lessonData" class="p-4 bg-indigo-50 border border-indigo-100 rounded-lg text-sm text-indigo-900">
            <h3 class="font-bold text-base mb-1">{{ lessonData.title }}</h3>
            <p class="text-indigo-700">级 别：HSK {{ lessonData.level }}</p>
            <p class="text-indigo-700">模块数：{{ lessonData.modules ? lessonData.modules.length : 0 }} 个</p>
          </div>

          <div class="pt-4 flex gap-4">
            <button @click="launchStudentView" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow transition">
              🚀 投屏/启动学生端页面
            </button>
          </div>
        </div>
      </section>

      <!-- 课堂二维码 -->
      <section class="bg-white p-6 rounded-xl shadow-md border border-slate-200 flex flex-col items-center justify-center text-center">
        <h2 class="text-lg font-bold text-slate-800 mb-2">2. 学生扫码加入</h2>
        <p class="text-xs text-slate-500 mb-4">扫码快速进入当前选中的课程</p>
        
        <div id="qrcode-container" class="p-3 bg-white border border-slate-200 rounded-lg shadow-inner min-h-[160px] flex items-center justify-center">
          <div id="qrcode"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const { createApp, ref, onMounted, watch } = Vue;

    createApp({
      setup() {
        const selectedJson = ref('data/hsk4-l11.json');
        const lessonData = ref(null);
        let qrcodeObj = null;

        // 获取选中的 JSON 内容预览
        const fetchLessonPreview = async (jsonUrl) => {
          try {
            const res = await fetch(jsonUrl);
            if (res.ok) {
              lessonData.value = await res.json();
            }
          } catch (e) {
            console.warn('预览数据读取失败或在本地 file:// 环境下运行:', e);
          }
        };

        // 补全报错中缺失的 helper 函数
        const getPracticeName = (type) => {
          const map = {
            'hanzi': '汉字跟写',
            'match': '词语连线',
            'pk': '诸神之战 PK',
            'listening': '听力练习',
            'reading': '阅读理解'
          };
          return map[type] || '综合练习';
        };

        // 生成二维码
        const updateQRCode = () => {
          const studentUrl = `${window.location.origin}${window.location.pathname.replace('teacher.html', 'index.html')}?lesson=${encodeURIComponent(selectedJson.value)}`;
          const qrElement = document.getElementById('qrcode');
          
          if (qrElement) {
            qrElement.innerHTML = '';
            qrcodeObj = new QRCode(qrElement, {
              text: studentUrl,
              width: 140,
              height: 140
            });
          }
        };

        // 跳转学生端
        const launchStudentView = () => {
          const studentUrl = `index.html?lesson=${encodeURIComponent(selectedJson.value)}`;
          window.open(studentUrl, '_blank');
        };

        watch(selectedJson, (newVal) => {
          fetchLessonPreview(newVal);
          updateQRCode();
        });

        onMounted(() => {
          fetchLessonPreview(selectedJson.value);
          // 确保 DOM 挂载完成后再渲染二维码
          setTimeout(() => {
            updateQRCode();
          }, 100);
        });

        return {
          selectedJson,
          lessonData,
          getPracticeName,
          launchStudentView
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
